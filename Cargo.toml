[package]
name = "xeonitte"
version = "0.1.0"
edition = "2024"
default-run = "xeonitte"
authors = [
  "Sokhibjon Orzikulov <sakhib@orzklv.uz>",
  "Victor Fuentes <vlinkz@snowflakeos.org>",
]

[dependencies]
# GNOME
# relm4 = { version = "0.11.0", features = ["libadwaita", "macros", "gnome_50" ] }
relm4 = { git = "https://github.com/rafanochi/Relm4", branch = "main",  features = ["libadwaita", "macros", "gnome_50" ]}
relm4-components = { package = "relm4-components", version = "0.11.0" }
libgweather = "4.8.0"
vte = { package = "vte4", version = "0.10"}
gnome-desktop = { package = "gnome-desktop-xinux", version = "0.22" }

tokio = { version = "1.52.3", features = ["full"] }
tracker = "0.2.2"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
simplelog = "0.12.2"
anyhow = "1.0.102"
size = "0.5.0"
distinst-disks = { git = "https://git.oss.uzinfocom.uz/xinux/distinst" }
reqwest = { version = "0.13.4", features = ["blocking", "multipart","stream"] }
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
regex = "1.12.3"
log = "0.4.30"

report = { git = "https://git.oss.uzinfocom.uz/xinux/relago.git", branch = "main" }
utils = { git = "https://git.oss.uzinfocom.uz/xinux/relago.git", branch = "main" }
garde = { version = "0.23.0", features = ["derive"] }
struct-patch = "0.12.7"

[workspace]
members = [".", "xeonitte-helper"]
default-members = [".", "xeonitte-helper"]

[lints.rust]
unused_must_use = "allow"
