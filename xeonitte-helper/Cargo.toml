[package]
name = "xeonitte-helper"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
uzers = "0.12.2"
libparted = "0.1.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
anyhow = "1.0.102"
distinst-disks = { git = "https://github.com/xinux-org/distinst/" }
distinst-disk-ops = { git = "https://github.com/xinux-org/distinst/" }
disk-types = { git = "https://github.com/xinux-org/distinst/" }

[[bin]]
name = "xeonitte-helper"
path = "src/main.rs"
