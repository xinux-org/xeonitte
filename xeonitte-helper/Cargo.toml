[package]
name = "xeonitte-helper"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
uzers = "0.12.2"
libparted = "0.1.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
anyhow = "1.0.102"
distinst-disks = { git = "https://git.oss.uzinfocom.uz/xinux/distinst" }
distinst-disk-ops = { git = "https://git.oss.uzinfocom.uz/xinux/distinst" }
disk-types = { git = "https://git.oss.uzinfocom.uz/xinux/distinst" }
log = "0.4.30"

[[bin]]
name = "xeonitte-helper"
path = "src/main.rs"
