name: Disk Layout CI

on: [push, pull_request]

env:
  NIX_CONFIG: "experimental-features = nix-command flakes"

jobs:
  generate:
    name: Regenerate & verify configs
    runs-on: native
    steps:
      - uses: actions/checkout@v4

      - name: Generate disk layout configs
        env:
          CARGO_TARGET_DIR: /tmp/xeonitte-target
        run: nix develop -c cargo run -p test-config

      - name: Verify generated configs are committed
        run: |
          git diff --exit-code test-config/generated/ || {
            echo "Generated configs are out of date. Run 'cargo run -p test-config' and commit the result."
            exit 1
          }

  vm-tests:
    name: NixOS VM tests
    needs: generate
    runs-on: native
    steps:
      - uses: actions/checkout@v4

      - name: Run NixOS disko VM tests
        run: |
          nix flake check ./test-config \
            --option extra-system-features "nixos-test kvm benchmark big-parallel" \
            --keep-going
